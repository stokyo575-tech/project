<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - WhiteGpt</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/login.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
  <!-- Devil Loading Screen -->
  <div class="devil-loader" id="devil-loader">
    <div class="devil-character">
      <div class="devil-head">
        <div class="devil-horn left"></div>
        <div class="devil-horn right"></div>
        <div class="devil-eye left"></div>
        <div class="devil-eye right"></div>
        <div class="devil-smile"></div>
      </div>
      <div class="devil-body"></div>
      <div class="devil-arm left"></div>
      <div class="devil-arm right"></div>
      <div class="devil-tail"></div>
      <div class="energy-particle"></div>
      <div class="energy-particle"></div>
      <div class="energy-particle"></div>
      <div class="energy-particle"></div>
      <div class="energy-particle"></div>
    </div>
    <div class="loading-text">
      Loading
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div class="loading-progress">
      <div class="loading-progress-bar"></div>
    </div>
  </div>

  <!-- Animated particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-text">W</div>
      <h1>WhiteGpt</h1>
      <p class="subtitle" id="form-title">Masuk untuk melanjutkan</p>

      <!-- Login Form -->
      <form id="loginForm" style="display: block;">
        <input type="text" id="username" placeholder="Username" required autocomplete="username"/>
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password"/>
        
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" />
            <span>Ingat saya</span>
          </label>
          <button type="button" class="toggle-register" onclick="toggleRegister()">Buat Akun</button>
        </div>
        
        <button type="submit" class="btn-ripple btn-shimmer">
          <i class="fas fa-sign-in-alt"></i>
          <span>Masuk</span>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;">
        <input type="text" id="reg-username" placeholder="Username" required />
        <input type="email" id="reg-email" placeholder="Email (opsional)" />
        <input type="password" id="reg-password" placeholder="Password" required />
        <input type="password" id="reg-confirm" placeholder="Konfirmasi Password" required />
        
        <div class="form-options">
          <button type="button" class="toggle-register" onclick="toggleRegister()">Kembali ke Login</button>
        </div>
        
        <button type="submit" class="btn-ripple btn-shimmer">
          <i class="fas fa-user-plus"></i>
          <span>Daftar</span>
        </button>
      </form>

      <div class="divider-or">ATAU</div>

      <button id="stayLoggedOutBtn" class="btn-stay-out">
        <i class="fas fa-door-open"></i>
        <span>Lanjutkan Tanpa Login</span>
      </button>

      <p id="errorMsg" class="error"></p>
    </div>
  </div>

  <script src="../js/role-manager.js"></script>
  <script src="../js/auth-new.js"></script>
  <script>
    // Hide loading screen after page loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('devil-loader');
        if (loader) {
          loader.classList.add('hidden');
        }
      }, 1500);
    });

    // Toggle between login and register forms
    function toggleRegister() {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const formTitle = document.getElementById('form-title');
      
      if (loginForm.style.display === 'block') {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        formTitle.textContent = 'Buat Akun Baru';
      } else {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        formTitle.textContent = 'Masuk untuk melanjutkan';
        document.getElementById('errorMsg').textContent = '';
      }
    }

    // Login handler
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const rememberMe = document.getElementById("rememberMe").checked;
      const errorMsg = document.getElementById("errorMsg");
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading...</span>';
      
      try {
        const result = await authenticate(username, password);
        
        if (result.success) {
          if (rememberMe) {
            localStorage.setItem('rememberMe', 'true');
            localStorage.setItem('lastUsername', username);
          }
          
          const loader = document.getElementById('devil-loader');
          if (loader) loader.classList.remove('hidden');
          
          setTimeout(() => {
            window.location.href = "../../index.html";
          }, 1000);
        } else {
          errorMsg.textContent = result.message;
          errorMsg.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Masuk</span>';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMsg.textContent = "Terjadi kesalahan. Silakan coba lagi.";
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Masuk</span>';
      }
    });

    // Register handler
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const username = document.getElementById("reg-username").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value.trim();
      const confirm = document.getElementById("reg-confirm").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      if (password !== confirm) {
        errorMsg.textContent = "Password tidak sama";
        errorMsg.classList.add('show');
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading...</span>';
      
      try {
        const result = await registerUser(username, password, email);
        
        if (result.success) {
          errorMsg.textContent = '✅ Pendaftaran berhasil! Silakan login.';
          errorMsg.style.color = '#4caf50';
          errorMsg.classList.add('show');
          
          setTimeout(() => {
            toggleRegister();
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-plus"></i><span>Daftar</span>';
          }, 1500);
        } else {
          errorMsg.textContent = result.message;
          errorMsg.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-user-plus"></i><span>Daftar</span>';
        }
      } catch (error) {
        errorMsg.textContent = "Terjadi kesalahan. Silakan coba lagi.";
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-user-plus"></i><span>Daftar</span>';
      }
    });

    // Stay logged out handler
    document.getElementById("stayLoggedOutBtn").addEventListener("click", async () => {
      stayLoggedOut();
      localStorage.setItem('stayLoggedOut', 'true');
      window.location.href = "../../index.html";
    });

    // Load saved username if remember me was checked
    window.addEventListener('load', () => {
      if (localStorage.getItem('rememberMe') === 'true') {
        const lastUsername = localStorage.getItem('lastUsername');
        if (lastUsername) {
          document.getElementById('username').value = lastUsername;
          document.getElementById('rememberMe').checked = true;
        }
      }
    });
  </script>
</body>
</html>
