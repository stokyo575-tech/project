<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - WhiteGpt</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/login.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
  <!-- Devil Loading Screen -->
  <div class="devil-loader" id="devil-loader">
    <div class="devil-character">
      <div class="devil-head">
        <div class="devil-horn left"></div>
        <div class="devil-horn right"></div>
        <div class="devil-eye left"></div>
        <div class="devil-eye right"></div>
        <div class="devil-smile"></div>
      </div>
      <div class="devil-body"></div>
      <div class="devil-arm left"></div>
      <div class="devil-arm right"></div>
      <div class="devil-tail"></div>
      <div class="energy-particle"></div>
      <div class="energy-particle"></div>
      <div class="energy-particle"></div>
      <div class="energy-particle"></div>
      <div class="energy-particle"></div>
    </div>
    <div class="loading-text">
      Loading
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div class="loading-progress">
      <div class="loading-progress-bar"></div>
    </div>
  </div>

  <!-- Animated particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-text">W</div>
      <h1>WhiteGpt Login</h1>
      <p class="subtitle">Masuk untuk melanjutkan</p>

      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required autocomplete="username"/>
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password"/>
        <button type="submit" class="btn-ripple btn-shimmer">
          <i class="fas fa-sign-in-alt"></i>
          <span>Masuk</span>
        </button>
      </form>

      <p id="errorMsg" class="error"></p>
    </div>
  </div>

  <script src="../js/role-manager.js"></script>
  <script src="../js/auth-new.js"></script>
  <script>
    // Hide loading screen after page loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('devil-loader');
        if (loader) {
          loader.classList.add('hidden');
        }
      }, 1500); // Show loading for 1.5 seconds
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading...</span>';
      
      try {
        const result = await authenticate(username, password);
        
        if (result.success) {
          // Success - show loading screen then redirect
          const loader = document.getElementById('devil-loader');
          if (loader) {
            loader.classList.remove('hidden');
          }
          setTimeout(() => {
            window.location.href = "../../index.html";
          }, 1000);
        } else {
          // Show error
          errorMsg.textContent = result.message;
          errorMsg.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Masuk</span>';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMsg.textContent = "Terjadi kesalahan. Silakan coba lagi.";
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Masuk</span>';
      }
    });
  </script>
</body>
</html>
